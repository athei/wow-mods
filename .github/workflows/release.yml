name: release

# Pushing a v* tag opens an empty draft release. The bundles need the local
# Wine-on-macOS cross toolchain (WINE_SDK, winebuild, xwin, Xcode), so they are
# built on a dev machine with `make bundle` and uploaded to the draft by hand;
# release notes come from GitHub's "Generate release notes" button at publish
# time.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag and both workspace versions have to agree. The release identity
      # every DLL logs on load comes from the tag (`git describe`), the fallback
      # identity from the manifest, so a disagreement means a shipped binary
      # names a version that is not the one being released.
      - name: Verify the tag matches the manifest version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for ws in windows unix; do
            got=$(sed -n 's/^version = "\(.*\)"/\1/p' "$ws/Cargo.toml")
            [ "$got" = "$expected" ] || {
              echo "$ws/Cargo.toml version $got does not match tag $GITHUB_REF_NAME" >&2
              exit 1
            }
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Build locally with \`make bundle\` and upload the zips from \`dist/\`, then use *Generate release notes* and publish."
