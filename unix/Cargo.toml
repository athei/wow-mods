[workspace]
members = ["bridge", "translate-sys", "shared"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "1.11.0"
license = "MIT"
description = "WoW 1.12 client mods (perf reimpls + on-device chat translation) for Wine on macOS"
authors = ["Alexander Theissen <alex.theissen@me.com>"]
repository = "https://github.com/athei/wow-mods"

[workspace.dependencies]
bitflags = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2"
log = "0.4"
wow-shared = { path = "shared" }
wow-translate-sys = { path = "translate-sys" }
objc2 = "0.6"
strum = { version = "0.28", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
# Limited debug info for post-mortem symbolication of `.so` crashes. On Mach-O
# the debug info goes into the binary itself; the size delta is dev-only disk.
debug = 1
# `release` is the everyday `make` build; `production` (PROD=1) overrides off.
debug-assertions = true
overflow-checks = true

# Shipped builds — fat cross-crate LTO + a single codegen unit. Activated by
# `PROD=1 make`.
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false

# Warn-level so a plain `cargo clippy` (or an editor) reports findings without
# hard-failing; the hard gate is `make check`, which denies every warning via
# cargo's `build.warnings = "deny"`.
[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_safety_doc = "warn"
not_unsafe_ptr_arg_deref = "warn"
transmute_ptr_to_ref = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
# The polynomials are written as explicit multiply-and-add because that is what
# the originals did, and fusing the pair removes an intermediate rounding. The
# x86-64-v2 baseline also has no hardware FMA, so `mul_add` would lower to an
# `fmaf` libcall.
suboptimal_flops = "allow"              # 23

# --- The numeric-kernel exemption -------------------------------------------
#
# `trig.rs` and `ftol.rs` reproduce the client's polynomial evaluation and its
# float-to-int conversion bit for bit, so they carried a blanket
# `#![allow(clippy::pedantic, clippy::nursery)]`. Enumerated here for the same
# reason as the windows workspace: a named list with counts is debt somebody
# can watch, and every lint not on it now fires. Counts are what each lint
# reports under `cargo clippy --all-targets` across this workspace with the lint
# force-warned, deduplicated on (lint, file, line, column) because `--all-targets`
# compiles each lib twice. `make lint-counts` checks them and
# `make lint-counts-update` rewrites them; they are not maintained by hand.
# See docs/CONVENTIONS.md §"Warning suppressions".
cast_precision_loss = "allow"           # 16
cast_possible_truncation = "allow"      # 14
must_use_candidate = "allow"            # 8
cast_sign_loss = "allow"                # 2
cast_possible_wrap = "allow"            # 3
missing_const_for_fn = "allow"          # 1
float_cmp = "allow"                     # 1
