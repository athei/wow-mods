[build]
target = "i686-pc-windows-msvc"

[target.i686-pc-windows-msvc]
linker = "lld-link"
# NO BMI here: the baseline is plain `nehalem`. These DLLs are guest code, so
# they run under whichever x86 translator the host Wine uses, and an arm64
# Wine translates a 32-bit guest with `xtajit`, which implements neither BMI2
# nor BMI1. Either one aborts module init with STATUS_ILLEGAL_INSTRUCTION
# (c000001d) and takes the client down at startup — a `mulx` or an `andn`
# reached from a DllMain is enough. Rosetta implements both, which is why the
# flags looked free for as long as every host Wine was x86_64.
#
# LZCNT goes with them, for the opposite reason: a CPU without ABM decodes it
# as BSR rather than faulting, so an unsupported one would go unnoticed while
# quietly returning a different answer. `tzcnt` still appears in the emitted
# code, which is fine and not a hole in the rule: LLVM only emits it where BSF
# semantics agree, and the encoding is a REP-prefixed BSF that any x86 decodes.
#
# The two sides that keep BMI both have an argument for it. `avx.toml` raises
# this target to haswell for the native-Windows build, which runs on real
# hardware with no translator in the way; `unix/.cargo/config.toml` keeps it
# for the x86_64 `.so`, which is host code and only ever runs under Rosetta.
#
# Frame pointers are opt-in and off here, which is a change of posture rather
# than a detail. Forcing them pins EBP out of the eight GPRs for every function
# in the DLL, and a static read of the shipped codegen found the resulting
# pressure behind a long tail of spills and reloads in bodies that are one live
# value over budget. None of that code wants a frame pointer for itself.
#
# What the frames buy is stack attribution in a profile: the guest-pc sampler
# recovers call stacks by walking the guest EBP chain, and without them every
# walk stops at the leaf. That is a capture-time need, not a shipping one, so
# it sits behind a knob: `FP=1 make …` loads `fp.toml`, which puts the frames
# back. Profiling and tripwire sessions build `FP=1 PERF=1 make install`;
# everything else, the release bundle included, ships without them.
#
# The relocation model is pinned off PIC, which is this target's default and
# which on i686 encodes every jump table as label differences against a base
# the dispatching function has to materialize itself: a `call` to the next
# instruction followed by a `pop`, costing a taken branch, a stack write, a
# reload and a register held live across the whole dispatch, and, being a call
# with no matching return, desynchronizing the return-address predictor for
# every return above it. Non-PIC gets the same tables as absolute addresses
# reached by one memory-indirect `jmp`, the way this DLL already reaches all of
# its own data. It stays relocatable: those addresses carry ordinary base
# relocations, so the image keeps a full `.reloc` section and the loader keeps
# rebasing it, which it does on essentially every run because the preferred
# base is rarely free.
#
# `dynamic-no-pic` and not `static`, and the difference is not cosmetic. Both
# turn the tables absolute, but `static` additionally tells the backend that
# every symbol is defined in this image, which is false for the Win32 imports:
# it marks `dllimport` globals as local and the module then fails the
# compiler's own IR verifier. Every one of this workspace's four `cdylib`s hits
# it. `dynamic-no-pic` drops position independence and leaves imported symbols
# indirect, which is exactly the split a DLL needs.
rustflags = [
    "-C", "target-cpu=nehalem",
    "-C", "target-feature=-crt-static",
    "-C", "relocation-model=dynamic-no-pic",
    "-C", "force-frame-pointers=no",
    "-Lnative=/opt/xwin/crt/lib/x86",
    "-Lnative=/opt/xwin/sdk/lib/um/x86",
    "-Lnative=/opt/xwin/sdk/lib/ucrt/x86",
]

[env]
# xwin include paths repeated for C and C++ — cc-rs reads CFLAGS_<target>
# and CXXFLAGS_<target> separately with no cross-fallback, and TOML has
# no variable substitution. snmalloc-sys needs the C++ path for <atomic>;
# libmimalloc-sys only needs the C one.
#
# `-march=nehalem` mirrors the rustflags `target-cpu` baseline so build-script
# C/C++ code (snmalloc-sys is the big one — ~300 KB of object in release) gets
# the same ISA — including the absence of BMI, for the reason given above the
# rustflags. These DLLs run under x86-on-ARM translation, whose vector unit is
# 128-bit: 256-bit AVX/AVX2 ops are split across two halves and underperform
# plain SSE, so the baseline caps at SSE4.2 (128-bit, 1:1 with the host vector
# unit). cc-rs invokes clang for this target (the `-idirafter` flags here are
# clang-style), so these flags propagate without needing an MSVC `/arch:`
# spelling. `-fomit-frame-pointer` matches the rustflags posture above so the
# C++ half of the DLL frees EBP too.
#
# Both overlay files (`avx.toml`, `fp.toml`) repeat these two lines in full,
# because an overlay REPLACES an `[env]` string rather than adding to it. A
# flag added here has to be added there as well.
CFLAGS_i686-pc-windows-msvc   = "-march=nehalem -fomit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CXXFLAGS_i686-pc-windows-msvc = "-march=nehalem -fomit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
AR_i686-pc-windows-msvc       = "/opt/homebrew/opt/llvm/bin/llvm-lib"
