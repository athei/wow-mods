# Frame-pointer overlay, loaded on top of config.toml via
# `cargo --config .cargo/fp.toml` (the `FP=1` Makefile knob). The default build
# omits frame pointers so EBP is an ordinary allocatable register across the
# whole DLL; this puts them back, because the guest-pc sampler recovers a call
# stack by walking the guest EBP chain and a profile from a build without them
# stops at the leaf and can attribute nothing to a caller. Pair it with `PERF=1`
# for a capture: `FP=1 PERF=1 make install`.
#
# rustflags ARRAYS from merged config sources are JOINED, with this file's
# entries placed later, so `force-frame-pointers=yes` overrides the base `no`
# (last -C wins) while the ISA baseline, the relocation model and the -Lnative
# xwin paths from config.toml all survive. [env] STRINGS are REPLACED wholesale,
# so the whole flag list from config.toml is repeated here with the C/C++ half
# of the same switch flipped. Keep the two files in sync.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "force-frame-pointers=yes"]

[env]
CFLAGS_i686-pc-windows-msvc   = "-march=nehalem -fno-omit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
CXXFLAGS_i686-pc-windows-msvc = "-march=nehalem -fno-omit-frame-pointer -idirafter /opt/xwin/crt/include -idirafter /opt/xwin/sdk/include/ucrt -idirafter /opt/xwin/sdk/include/um -idirafter /opt/xwin/sdk/include/shared"
