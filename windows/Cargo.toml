[workspace]
members = ["turbo", "translate", "version", "hook", "bridge"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "1.9.0"
license = "MIT"
description = "WoW 1.12 client mods (perf reimpls + on-device chat translation) for Wine on macOS"
authors = ["Alexander Theissen <alex.theissen@me.com>"]
repository = "https://github.com/athei/wow-mods"

[workspace.dependencies]
wow-hook = { path = "hook" }
wow-shared = { path = "../unix/shared" }
ab_glyph = "0.2"
libm = "0.2"
log = "0.4"
memchr = "2"
miniz_oxide = { version = "0.9", features = ["simd"] }
minhook = "0.9"
rustc-hash = "2"
jpeg-encoder = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
# Limited debug info for post-mortem symbolication of crash backtraces.
# Function names + line tables + inline frame chain — the last matters because
# thin LTO inlines freely across the reimplementation surface, so a raw frame
# often lands in a caller several levels up from the code that faulted. On MSVC
# the bytes land in the side-by-side `.pdb`, not the shipped DLL.
debug = 1
# `release` is the everyday `make` build, so carry the debugging checks here;
# `production` (PROD=1) overrides both back off below.
debug-assertions = true
overflow-checks = true

# Shipped builds — fat cross-crate LTO + a single codegen unit. Activated by
# `PROD=1 make`.
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false

# Warn-level so a plain `cargo clippy` (or an editor) reports findings without
# hard-failing; the hard gate is `make check`, which denies every warning via
# cargo's `build.warnings = "deny"`.
[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Length is a poor proxy for complexity; allow long procedural functions
# (per-opcode dispatchers, codegen templates) where the structural alternative
# is fragmented helpers threading the same state.
too_many_lines = "allow"                # 71
# A separate multiply and add is what the originals compiled to, and the
# differential harness compares against that — fusing them changes the rounding
# and the comparison fails. It is also faster on the default baseline: nehalem
# has no hardware FMA, so `mul_add` lowers to an `fmaf` libcall. (The AVX2
# native-Windows variant does have FMA, which is why the faithfulness argument
# is the one that carries this and not the ISA.)
suboptimal_flops = "allow"              # 1192
# Stricter unsafe discipline.
missing_safety_doc = "warn"
not_unsafe_ptr_arg_deref = "warn"
transmute_ptr_to_ref = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"

# --- The reimplementation exemption -----------------------------------------
#
# `wow_turbo` replaces client functions with Rust that has to reproduce their
# machine behaviour, so a transcription reads nothing like idiomatic Rust and
# a large slice of `pedantic`/`nursery` argues against the point of the file.
# Every reimplementation module used to open with a blanket
# `#![allow(clippy::pedantic, clippy::nursery)]`, which switched off some four
# hundred lints to silence the few dozen below and hid everything else along
# with them. The list below is that blanket, enumerated: the counts are what
# each lint reports today, so the debt is a number somebody can watch instead of
# an unknown behind a group name. Anything NOT named here now fires — which is
# the property the blanket cost us.
#
# Counts are `wow-turbo-dll` on the i686 target with `--all-targets`, so the
# test-only entries at the foot of the list are included; the other four crates
# report none of these. They are regenerated by `make lint-counts`, not
# maintained by hand. See docs/CONVENTIONS.md §"Warning suppressions".

# Shape of a transcription. The originals interleave declarations with code,
# read packed client structs through pointer casts, and carry addresses and
# masks as literals grouped the way the source grouped them. Rewriting any of
# it to suit a lint makes the reimplementation harder to check against the
# behaviour it has to match.
items_after_statements = "allow"        # 847
cast_ptr_alignment = "allow"            # 924 — reads are already `read_unaligned`
unreadable_literal = "allow"            # 396 — addresses and bit masks, verbatim
similar_names = "allow"                 # 224
semicolon_if_nothing_returned = "allow" # 156
many_single_char_names = "allow"        # 42

# Numeric conversions that must truncate, wrap and round exactly as the
# original did. The usual fix — `try_from(..).expect(..)` — turns a silent
# narrowing into a panic, which is a behaviour change, and in a per-frame hook
# it is a crash. Float comparison is exact on purpose: the differential harness
# compares bit patterns.
cast_possible_truncation = "allow"      # 388
cast_sign_loss = "allow"                # 232
cast_possible_wrap = "allow"            # 102
cast_precision_loss = "allow"           # 115
cast_lossless = "allow"                 # 60
float_cmp = "allow"                     # 49

# Pointer casts in the transcription — these convert no numbers, so the
# narrowing/rounding argument above does not reach them. The client's records
# are read through raw pointers held as the stock routine held them; `&raw const`
# and `.cast()` are bit-identical rewrites, but they re-spell every access site
# and move the code away from the original it has to be checked against.
borrow_as_ptr = "allow"                 # 43
ptr_as_ptr = "allow"                    # 24
ptr_cast_constness = "allow"            # 12
# All five are `(a*a + b*b).sqrt()`, which clippy wants as `hypot`. `hypot` is a
# different algorithm — it rescales operands and rounds differently — so it does
# not reproduce the transcribed `mul, mul, add, sqrt` the harness compares.
imprecise_flops = "allow"               # 8

# Style preferences that fight the transcription: restructuring control flow to
# satisfy them moves code away from the shape being reproduced, for no change
# in what the function does.
missing_const_for_fn = "allow"          # 112
useless_let_if_seq = "allow"            # 23
if_not_else = "allow"                   # 12
suspicious_operation_groupings = "allow" # 12
# The tail `match` of a transcribed function: the arms ARE the original's branch
# structure, and four of the five sites are installed hook adapters.
option_if_let_else = "allow"            # 3
# Each site destructures a fixed-size array just read out of the client's memory,
# and the index literals are that record's field map.
tuple_array_conversions = "allow"       # 4
# The duplicated statement is a raw field read whose branch condition calls into
# the client's own input controller; hoisting it would reorder the two.
branches_sharing_code = "allow"         # 3
# `if cond { 1 } else { 0 }` transcribes a stock branch/`setcc` that stores an
# int, not an idiom anyone reached for.
bool_to_int_with_if = "allow"           # 3
# `flags & 3` is the original's flag test, and the mask is the function's
# vocabulary — `& 0x200f`, `& 0x200000` and `& 0x200` follow in the same body.
verbose_bit_mask = "allow"              # 1
# The parameters mirror the pointers the stock routine holds, so the signature is
# ABI-shaped: see §"An argument list that mirrors a calling convention".
trivially_copy_pass_by_ref = "allow"    # 2
# The house shape for this surface: a `math::` kernel returns `Option`, the hook
# forwards the accepted value or takes the stock error arm.
single_match_else = "allow"             # 1
# The `else` is one half of a matched pair of `ZERO <= s` splits transcribing the
# original's Voronoi-region cascade; dropping it hides the symmetry.
redundant_else = "allow"                # 1

# Test idioms. The kernel tests sweep an input range by stepping a float and
# compare against an independent oracle, and they mask expected values with the
# same decimal quantities the comment above each one derives — rewriting either
# to satisfy the lint makes the test harder to read against its own reasoning.
while_float = "allow"                   # 9
# The masked operands are decimal quantities, not bit patterns: `65025` is
# `255 * 255` as the comment above derives it, `50`/`33` are the test's own
# coordinates. Hex would sever each literal from the arithmetic it comes from.
decimal_bitwise_operands = "allow"      # 3

