# 0x637523 and 0x63752b leave standing: the three normal lanes are narrowed to
# f32 in memory while `d` is built from the wide values the stores kept in the
# registers, so any last-place difference arrives at `d` unattenuated and the
# cancellation in the dot amplifies it. One case runs to about 0.3% relative,
# and it does so on a `d` of order 1e-8, where every term that builds it is
# orders larger. The byte compare stays as written: on the three normal lanes it
# is the watch that the normal itself has not moved, and they are silent.
