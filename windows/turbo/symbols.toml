# `Wow.exe` — WoW 1.12 (build 5875). image_base 0x00400000 (non-DYNAMICBASE;
# loads at the fixed base under Wine). A VA at base 0x400000 ⇒
# rva = VA − 0x400000; each `rva`/`sig` is confirmed against the local `WoW.exe`.
#
# Hand-edited hook manifest; the build script turns it into
# `symbols.rs`. NEVER edit the generated file — edit this one.
#
# One fully-specified [functions.Name] entry per hooked function; ALL fields are
# required:
#   rva      — located address in this build (VA − image_base)
#   sig      — entry-anchored wildcard byte signature ("55 8B EC ?? …"); the
#              installer matches it against the bytes at `rva` and REFUSES TO PATCH
#              on a mismatch. A LIST of patterns is also accepted, for an entry
#              whose reimpl stands in for more than one known prologue at that
#              address (a hot method a mod replaces wholesale); any one matching
#              permits the patch, matching none is still the refusal.
#   abi      — cdecl | stdcall | thiscall | fastcall; governs argument passing
#              (ecx/edx for thiscall/fastcall), the return-value location, and the
#              `ret` stack cleanup
#   ret      — Rust return type ("u32", "u64", "void", …)
#   args     — Rust parameter types (e.g. ["*mut u8", "u32"]; [] for none)
#   preserve — volatile GP registers (subset of "eax"/"ecx"/"edx"; [] for none) the
#              original leaves intact and our reimpl must also leave intact. The
#              1.12 client's MSVC keeps caller-saved registers live across calls to
#              these internal functions (ABI-breaking interprocedural register
#              allocation), so a reimpl that scratches one corrupts a value the
#              caller relied on. ORTHOGONAL to `abi`. A non-empty set makes codegen
#              wrap the thunk in a minimal save/restore shim; [] emits a plain
#              thunk. Under-saving corrupts the caller; over-saving is benign.
# Codegen emits the original type, a private lazy resolver, the `extern "abi"`
# thunk, and the install wiring. The reimpl is plain Rust at `crate::hooks::<snake>`.
#
# One OPTIONAL top-level field exists: `armed_only = true` puts the install step
# behind the event gauge's arming check, so an unarmed run leaves the
# function stock. It is for observation hooks whose target is hot enough that
# even a trampoline on the unarmed path would be a measurable tax.
#
# One OPTIONAL sub-table is allowed per entry: `[functions.Name.diff]`, the
# differential-mode annotation. It only affects `WOW_TURBO_DIFF=1` builds (the
# harness); default builds emit identical thunks whether or not it is present.
#   mode     — "out" | "inout". Both run the live original AND the reimpl on the
#              same inputs and report only when the output region diverges
#              (inout snapshots the in-place buffer's pre-call state first).
#   out      — { arg, len }: the *mut output region (required for inout; for out
#              either this or a scalar return; absent for a pure scalar reader).
#   ins      — [{ arg, len }, …]: input regions snapshotted before the original
#              runs and replayed into the reimpl (so inout sees pre-call state).
#   float    — "f32" (lane compare within `ulp`, default) | "bytes" (exact memcmp).
#   ulp      — max ULP per f32 lane before a divergence is reported (default 4).
#   expected — true for a reimpl deliberately more precise than the original
#              (f64 intermediates); divergences log at debug, never warn.
#   delegates— true for a partial reimplementation that runs the original on the
#              shapes it does not model. On those calls both sides of the compare
#              are the same code, so they match by construction and a clean
#              result is NOT coverage; the arming line says so. Only set it when
#              the delegated call is replay-safe.
# `float` selects the REGION comparator and never reaches a scalar return, which
# always compares within `ulp` — so exactness on a scalar wants `ulp = 0`, not
# `float = "bytes"`. An f64 return is not compared at all.
# Runtime selection: `WOW_TURBO_DIFF_ARM=Name1,Name2|all`. out/inout adapters are
# checked by `tools/diff_audit.py` (no call-out, writes only the out arg).

[functions.C3Vector__Normalize]
rva  = 0x002720f0   # VA 0x6720f0 − image_base
sig  = "D9 41 08 D9 41 04 D9 01 D9 C0 D8 C9 D9 C2 D8 CB DE C1 D9 C3 D8 CC DE C1"
abi  = "fastcall"
ret  = "void"
args = ["*mut f32"]
preserve = ["eax", "ecx", "edx"]


# Golden-diff the written region, byte compare. Region covers everything the
# adapter touches, reads included: the argument is swapped for a fixed-size
# scratch buffer, so a read past the declared length reads past that buffer.
[functions.C3Vector__Normalize.diff]
mode  = "inout"
out   = { arg = 0, len = 12 }
float = "bytes"

[functions.C44Matrix__Multiply__7bc6a0]
rva  = 0x003bc6a0
sig  = "55 8B EC 8B C2 8B 55 08 D9 40 38 D8"
abi  = "fastcall"
ret  = "*mut f32"
args = ["*mut f32", "*const f32", "*const f32"]
preserve = []

# Golden-diff the product (out = arg 0, the whole 16-float matrix). Byte compare:
# each element is an independent four-term dot, so a per-element order or width
# difference is exactly one ulp and a tolerant compare would pass it.
#
# Both inputs are declared `ins` so they are snapshotted before the original
# runs. Without that the entry reports a false divergence whenever a caller
# aliases the destination over an input: the original is alias-safe (it builds
# all sixteen elements in stack temps and only then assigns), so callers may do
# it, and the compare path would then replay our adapter against an `a` the
# original had already overwritten. Our own adapter reads both inputs before it
# writes, so the hook is correct unarmed either way; this is about the harness
# telling the truth.
#
# `orig_twice` runs the original a second time on the same arguments and reports if
# it disagrees with itself. Safe here: the body writes only its destination matrix
# and its own stack temps, reads its two source matrices, and calls nothing that
# touches global state, so a second run recomputes the same thing and the game
# consumes it exactly as it would the first.
#
# SIGNED ZERO ON A ZERO LANE, SETTLED: this entry reports lanes 2 and 10 as
# `ours 0x80 vs orig 0x00`, a negative zero against a positive zero, and nothing
# else. It is not attributable to the reimplementation and there is nothing here
# to fix. Replaying the operands the harness dumped shows all four products of
# the failing lane are a zero times a value of the opposite sign, so all 24
# summation orders of those four terms give negative zero while the original
# returned positive zero. Order is not the explanation either: the sixteen `k`
# orders were re-transcribed from the stock bytes at 0x7bc6a8 through 0x7bc8dc
# and match the shipped table lane for lane. Nor is the original reading
# something else. `orig_twice` has stayed silent across an armed session that
# logged more than five thousand of these, so the original is a deterministic
# function of exactly the bytes it was handed, and on those bytes IEEE requires
# the negative zero our kernel produces. What is left is the host's x87
# multiply, which is where the sign is lost. `ins` drift cannot see any of it:
# drift compares the snapshot against live memory only after the original
# returns, and a sign bit that changed and changed back leaves no trace.
#
# `C44Matrix__RotateQuaternion__7bddb0` inherits the same report through its
# `call` at 0x7bded7 and needs no separate reading.
[functions.C44Matrix__Multiply__7bc6a0.diff]
mode  = "out"
out   = { arg = 0, len = 64 }
ins   = [{ arg = 1, len = 64 }, { arg = 2, len = 64 }]
float = "bytes"
orig_twice = true

