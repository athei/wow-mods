# under test here is the composition and the pinned quarter-turn matrix. The
# trig residual that forces `ulp`/`abs` on `C44Matrix__SetRotationAxisAngle__7bdb00`
# is common to both sides of this comparison and cancels.
#
# ARM THIS ENTRY ALONE. That cancellation is what the byte compare rests on, and
# arming `all` breaks it: `C44Matrix__SetRotationAxisAngle__7bdb00` armed means
# the game proceeds on ITS original's value, so the shell used as ground truth
# here composes with the hardware trig while this side composes with the
# polynomial. Every lane the builder's residual reaches then reports, not only
# the ones the cosine lands on: an armed session shows lanes 0, 1, 4, 5 and 6,
# which is where the multiply spreads it.
#
# The baseline for that is measured, not predicted. An `all` run reports 27,648
# times in about two minutes, and every report is a single byte adrift by one,
# so nothing under it exceeds an ulp in the lane it lands in. The pinned
# quarter-turn path produced none of them, and that silence is the reading to
# take from the number: it is the path that never enters 0x7bdb00, so it is also
# the check that the pinned matrix still tracks 0x7bdb00's own output, and
# everything reported is the armed builder's residual arriving through the
# multiply.
