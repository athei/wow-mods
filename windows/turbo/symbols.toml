# Arg 3 is `out_planes`, an output, and it is declared `ins` for one reason: an
# `ins` region is what redirects the replayed reimplementation's write into the
# snapshot buffer, so the replay cannot overwrite the planes the game is about
# to consume. The drift check that comes with it is not a drift check here. Its
# baseline is that snapshot, and the snapshot holds what the replay just wrote
# through the hooked `0x631440`, while the live side holds what the original's
# own `call` at 0x631c00 left there. Arm `0x631440` as well and the live side is
# ITS original's planes, so a divergence in that entry reaches this one as
# INPUT DRIFT on the same byte: one finding, reported twice, and the entry to
# read it on is the plane builder's. Arg 5 is sandboxed the same way and cannot
# drift, both sides writing the same 32 constant bytes.
#
# What this entry is a statement about is the compared `out` region, arg 4: the
# 27 corner floats the body builds itself.
[functions.Collision_BuildSweepPrism__631be0.diff]
