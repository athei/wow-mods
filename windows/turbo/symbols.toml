# cannot agree to the bit. Measured over the wrapped input range the polynomial
# is within 1 ulp of a correctly-rounded reference for both sin and cos, so 2 is
# a bound with a single ulp of headroom, not a shrug. Anything larger is a real
# divergence and still reports.
