#
# Lane compare with a 2-ulp bound, and the bound is measured rather than
# assumed. The region is nine whole f32 with nothing else in it, so it needs no
# `float_from` split. The original builds its three per-axis matrices from the
# hardware FSINCOS; we use the branchless polynomial the surrounding kernels
# need in order to vectorize, and the two cannot agree to the bit. What pins the
# residual to the trig is that it did not move when the 3x3 product underneath
# it was rebuilt from the bytes: one lane, one ulp, same count, before and
# after. The polynomial is within 1 ulp of a correctly-rounded reference over
# this input range, so 2 leaves a single ulp of headroom and anything larger
# still reports.
