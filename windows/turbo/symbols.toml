# the live client, e.g. ours 0x3ed8616c vs orig 0x3ed8616b. Lane 0, the cached
# yaw, never diverged, which is right because it is the wrapped input rather
# than a trig result, and the exact-compared head never diverged either.
[functions.Orientation__SetYaw__7acc40.diff]
