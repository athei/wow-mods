# What it reports is lane 3, `d`, and nothing else, and two readings of that are
# ruled out before the arithmetic one. It is not a composed arm: the body makes
# no call, so no other hook is inside this comparison. And it is not a
# reciprocal estimate on either side. The normalize is INLINE at
# 0x6374f2..0x63752b and it is an `FSQRT` followed by an `FDIVR` against the 1.0
# at 0x7ff9d8, which is the `1.0 / len2.sqrt()` the kernel writes, so no
# `RSQRTSS` is in the picture to explain a difference.
