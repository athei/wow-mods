# Golden-diff the written region. Region covers everything the adapter touches,
# reads included: the argument is swapped for a fixed-size scratch buffer, so a
# read past the declared length reads past that buffer.
#
# NOT a byte compare, and an armed session is why: 73,728 reports in two minutes,
# every one of them a one-to-seven ulp spread in the low byte of a displacement
# lane. Two causes were behind that, and only one of them was fixable.
#
# The fixable one was width. The original keeps `sin*inv`, the versine
# `inv - cos*inv`, both rotated horizontal terms and the `+0x70` scale on the
# x87 register stack from 0x7c530d through the stores at 0x7c532e/0x7c533d, and
# does the same with `speed*s1` into the `dt` multiply, so each component rounds
# exactly once; the reimplementation was rounding every step to `f32`. That is
# now transcribed from the stores and is gone.
#
# What is left is the trig, and it cannot be removed. The original's angle goes
# through the hardware `FSINCOS` at 0x7c5307 where this uses the shared
# polynomial, so the sine and cosine differ by a few `f32` ulp before anything
# else happens.
#
# Sizing that residual is an ABSOLUTE-error problem, not a ULP one, and the
# reason is the versine: it is `inv` minus a near-equal `cos*inv`, so as the
# step angle shrinks the result collapses toward zero while the error inherited
# from `cos` does not move, and the ULP distance grows without bound. A searched
# sweep over the range this entry sees (the resolved rate at `+0x9c` bracketed
# down to 1.0 rad/s against the client's own ~pi default, speed up to the 60.148
# cap the acceleration curve enforces, and a 4..500 Hz step) puts the worst
# lane at 3.3e-6 absolute while the same lanes run to 15,568 ulp. The bound is
# therefore carried by `abs`, and 5e-5 gives the measurement an order of
# headroom while still sitting three orders below a per-frame displacement.
#
# `ulp = 4` is the second gate rather than a measured residual: a lane must
# exceed BOTH, so it keeps a difference too small to matter from ever being
# reported on a large lane. Every lane in the region is an `f32`, so no
# `float_from`.
#
# One thing this table cannot do, stated rather than left to be assumed:
# over the same sweep the OLD per-step `f32` chain peaked at 5.2e-6, the same
# order as the trig residual, so no absolute bound can separate a return of the
# width defect from the trig. What pins the width is
# `wide_chain_pinned_at_run_speed` and `wide_chain_pinned_on_a_long_arc`, which
# compare bit patterns against the narrow chain directly.
[functions.CMovement__IntegrateArc_FlatTurn__7c52c0.diff]
mode  = "inout"
out   = { arg = 3, len = 12 }
float = "f32"
ulp   = 4
abs   = 5e-5

